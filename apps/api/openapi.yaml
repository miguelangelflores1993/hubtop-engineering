openapi: 3.1.0
info:
  title: HubTop Lite API
  version: 0.1.0
  description: |
    Spec 001: a client publishes an order and a professional of the same
    category sees it. Every route needs a Supabase Auth access token; the
    caller's account is the token's `sub`, never a field in the request.
servers:
  - url: http://127.0.0.1:8080
    description: local
security:
  - bearer: []
paths:
  /orders:
    post:
      operationId: createOrder
      summary: Publish an order as the signed-in account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /orders/feed:
    get:
      operationId: getFeed
      summary: Open orders of the caller's category, newest first (at most 50)
      responses:
        '200':
          description: The feed. `category` is null when the caller is not a professional, and then `orders` is empty.
          content:
            application/json:
              schema:
                type: object
                required: [category, orders, has_more]
                properties:
                  category:
                    type: [string, 'null']
                    examples: [plumbing]
                  orders:
                    type: array
                    maxItems: 50
                    items:
                      $ref: '#/components/schemas/Order'
                  has_more:
                    type: boolean
                    description: True when more than 50 orders matched and the list was cut. There is no way to page yet.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /orders/mine:
    get:
      operationId: getMyOrders
      summary: The caller's own orders, newest first (at most 50)
      responses:
        '200':
          description: The caller's orders
          content:
            application/json:
              schema:
                type: object
                required: [orders, has_more]
                properties:
                  orders:
                    type: array
                    maxItems: 50
                    items:
                      $ref: '#/components/schemas/Order'
                  has_more:
                    type: boolean
                    description: True when more than 50 orders matched and the list was cut. There is no way to page yet.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateOrder:
      type: object
      required: [category, description]
      description: Any other field, such as an owner, is ignored.
      properties:
        category:
          type: string
          examples: [plumbing]
        description:
          type: string
          description: |
            10 to 500 characters once surrounding whitespace is removed; stored
            trimmed. No length limits in the schema on purpose: they would count
            the untrimmed string and disagree with the API.
          examples: [The kitchen sink is leaking under the cabinet.]
    Order:
      type: object
      required: [id, category, description, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [open]
        created_at:
          type: string
          format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: A stable code; the message never says why a token was rejected.
          enum: [unauthorized, invalid_json, body_too_large, invalid_description, unknown_category, no_account, internal, timeout]
  responses:
    Error:
      description: |
        400 invalid_json (not one JSON object) · 401 unauthorized (no token,
        expired, forged, wrong issuer or audience) · 403 no_account (signed in
        but no account row) · 413 body_too_large (over 16 KiB) ·
        422 invalid_description or unknown_category · 500 internal ·
        503 timeout (the request's time limit passed). A read is safe to
        retry. After a 503 on POST /orders the order may have been stored:
        check GET /orders/mine before posting again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
